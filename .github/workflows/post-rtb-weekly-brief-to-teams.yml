name: Post RTB weekly brief to Teams

# Sibling of post-rtb-brief-to-teams.yml, for the Friday weekly edition.
#
# Created 2026-09-21. Before this date no weekly workflow existed, so the
# weekly Teams card had NEVER been posted — the weekly skill wrote
# weekly-news-brief/_teams_card.json faithfully and nothing ever read it.
# Separately, the weekly publish step itself was broken from 2026-09-09
# (it used the sandbox shell), so editions 09/04, 09/11 and 09/18 were
# generated and never reached the repo at all.
#
# Uses the same TEAMS_WEBHOOK_URL repo secret as the daily workflow, and the
# same content-fingerprint duplicate guard.

on:
  push:
    paths:
      - 'weekly-news-brief/_teams_card.json'
  workflow_dispatch: {}  # allow manual re-fire from the Actions tab

concurrency:
  group: post-rtb-weekly-brief-to-teams
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify card payload exists
        run: |
          if [ ! -f weekly-news-brief/_teams_card.json ]; then
            echo "::error::weekly-news-brief/_teams_card.json not found"
            exit 1
          fi
          echo "Card payload found, size: $(wc -c < weekly-news-brief/_teams_card.json) bytes"

      - name: Fingerprint the card
        id: fp
        run: |
          HASH=$(sha256sum weekly-news-brief/_teams_card.json | cut -c1-32)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Card fingerprint: $HASH"

      - name: Look for an existing posted-marker
        id: guard
        uses: actions/cache@v4
        with:
          path: .teams-posted-marker
          key: teams-posted-weekly-${{ steps.fp.outputs.hash }}

      - name: Skip — this exact card was already posted
        if: steps.guard.outputs.cache-hit == 'true'
        run: |
          echo "::notice::Duplicate suppressed. A weekly card with fingerprint ${{ steps.fp.outputs.hash }} has already been posted to Teams. Nothing sent."

      - name: POST adaptive card to Teams webhook
        if: steps.guard.outputs.cache-hit != 'true'
        env:
          TEAMS_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "$TEAMS_URL" ]; then
            echo "::error::TEAMS_WEBHOOK_URL secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          HTTP_CODE=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @weekly-news-brief/_teams_card.json \
            "$TEAMS_URL")

          echo "HTTP $HTTP_CODE"
          echo "Response body:"
          cat /tmp/response.txt
          echo ""

          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 202 ]; then
            echo "::error::Teams webhook returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "::notice::Weekly Teams card posted successfully"

      - name: Write posted-marker
        if: steps.guard.outputs.cache-hit != 'true'
        run: date -u +"%Y-%m-%dT%H:%M:%SZ posted ${{ steps.fp.outputs.hash }}" > .teams-posted-marker
